name: Import PLTreprint from Gitee

on:
  push:
    paths:
      - '.github/workflows/import-pltreprint.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy complete PLTreprint snapshot
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          git clone --depth 1 https://gitee.com/slandarer/PLTreprint.git "$tmpdir/upstream"
          rm -rf PLTreprint
          mkdir -p PLTreprint
          rsync -a --exclude='.git' "$tmpdir/upstream/" PLTreprint/
          rm -f .github/workflows/import-pltreprint.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import all content from gitee.com/slandarer/PLTreprint"
          git push origin HEAD:main
