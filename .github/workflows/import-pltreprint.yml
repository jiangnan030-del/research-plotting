name: Import PLTreprint from Gitee

on:
  push:
    paths:
      - '.github/workflows/import-pltreprint.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Copy complete PLTreprint snapshot
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=300 clone --depth 1 https://gitee.com/slandarer/PLTreprint.git "$tmpdir/upstream"
          rm -rf PLTreprint
          mkdir -p PLTreprint
          rsync -a --exclude='.git' "$tmpdir/upstream/" PLTreprint/

          git lfs install
          while IFS= read -r -d '' file; do
            git lfs track "$file"
          done < <(find PLTreprint -type f -size +90M -print0)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import all content from gitee.com/slandarer/PLTreprint"
          git push origin HEAD:main
