name: Import MATLAB-special-heatmap

on:
  push:
    paths:
      - '.github/workflows/import-matlab-special-heatmap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy complete upstream snapshot
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          git clone --depth 1 https://github.com/slandarer/MATLAB-special-heatmap.git "$tmpdir/upstream"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' "$tmpdir/upstream/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import all content from slandarer/MATLAB-special-heatmap"
          git push origin HEAD:main
